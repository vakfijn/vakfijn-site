<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review achterlaten | Vakfijn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;600&display=swap">
<style>
:root{--ant:#2C2A28;--goud:#D4A82C;--goud-d:#8A6A12;--zand:#F5F2EC;--grijs:#5E5A55;--lijn:#D9D2C5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;font-size:16px;line-height:1.6;color:var(--ant);background:var(--zand);animation:bodyIn .3s ease both}
@keyframes bodyIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:460px;margin:0 auto;padding:0 20px;text-align:center}
header{padding:40px 0 8px}
.logo{display:inline-block;color:inherit;text-decoration:none;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:.5px}
.logo i{display:block;width:40px;height:4px;background:var(--goud);margin:6px auto 0}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(30px,7vw,40px);letter-spacing:-.5px;line-height:1.1;margin:26px 0 10px}
p{color:var(--grijs);margin:0 0 26px}
.sterren{font-size:26px;letter-spacing:6px;color:var(--goud);margin:0 0 18px}
.knop{display:block;background:var(--goud);color:var(--ant);font-weight:600;font-size:17px;text-decoration:none;padding:17px;margin-bottom:14px;transition:background .15s}
.knop:hover{background:#c99b22}
.klein{font-size:13.5px;color:var(--grijs)}
.klein a{color:var(--goud-d);font-weight:600}
.voet{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--grijs);margin:46px 0 30px}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/" aria-label="Naar de homepage">VAKFIJN<i></i></a></header>
<div class="sterren" aria-hidden="true">★★★★★</div>
<h1>Tevreden met het werk?</h1>
<p>Een review kost je één minuut en helpt Vakfijn enorm. Vertel er even bij om wat voor klus het ging en in welke plaats — dan hebben anderen er ook iets aan.</p>
<a class="knop" href="https://g.page/r/CYVrCugnXHp2EBM/review" rel="noopener">Schrijf een Google-review</a>
<p class="klein">Liever via Werkspot? <a href="https://www.werkspot.nl/profiel/vakfijn" rel="noopener">Dat kan hier.</a></p>
<p class="voet">Vakfijn · Kitwerk · Afwerking</p>
</div>
</body>
</html>
